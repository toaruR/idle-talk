<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>idle-talk</title></head>
<body>
<h1>idle-talk</h1>
<p>状態: <span id="state">未接続</span> <span id="drama_state"></span> <span id="search"></span></p>
<p id="error" role="alert"></p>
<button id="start">開始</button>
<button id="drama" disabled>ドラマを一緒に見る</button>
<fieldset>
  <legend>設定</legend>
  <label><input type="checkbox" id="mute"> 休止</label>
  <label><input type="checkbox" id="on" checked> 自発発話 ON</label>
  <label><input type="checkbox" id="radio"> ラジオ</label>
  <label>沈黙秒数 <input type="number" id="interval_s" min="10" max="3600" value="1200"></label>
  <label>静音開始 <input type="time" id="quiet_start" value="23:00"></label>
  <label>静音終了 <input type="time" id="quiet_end" value="07:00"></label>
  <label id="persona_label" hidden>ペルソナ <select id="persona"></select></label>
  <label id="speaker_label" hidden>声 <select id="speaker"></select></label>
  <label>音量 <input type="range" id="volume" min="0" max="200" step="5" value="100"> <span id="volume_text">100%</span></label>
</fieldset>
<fieldset id="links_box" hidden>
  <legend>URL</legend>
  <ul id="links" style="max-height: 20em; overflow-y: auto;"></ul>
</fieldset>
<script src="worklet.js"></script>
<script src="player.js"></script>
<script src="client.js"></script>
<script>
(function () {
  const C = IdleTalkClient;
  const NAMES = { idle: '待機', user_speaking: 'ユーザー発話中', eot_check: '終話確認中',
    preparing: '返答準備中', ai_playing: 'AI再生中', interrupt_check: '割り込み確認中', rest: '休止' };
  const $ = (id) => document.getElementById(id);
  let client = null;
  let drama = null; // 共有中のタブの音 (startDramaCapture の戻り値)
  let sink = null;

  // 音量はブラウザ内だけで掛ける (サーバに送らない)。開始前でも変えられ、localStorage に残す
  const VOLUME_KEY = 'idle-talk.volume';
  function volume() { return IdleTalkPlayer.clampVolume(parseInt($('volume').value, 10) / 100); }
  function showVolume() {
    $('volume_text').textContent = `${$('volume').value}%`;
    if (sink) sink.setVolume(volume());
  }
  const savedVolume = localStorage.getItem(VOLUME_KEY);
  if (savedVolume !== null) $('volume').value = savedVolume;
  showVolume();
  $('volume').addEventListener('input', showVolume);
  $('volume').addEventListener('change', () => localStorage.setItem(VOLUME_KEY, $('volume').value));

  // 話したニュース・調べたページを URL 欄の先頭に積む (1 回分の並びは保つ)。MAX_LINKS 行を超えたら古い順 (下) から消す。
  // 同じ URL は前の行を消して先頭に付け直す。http(s) 以外は出さず、文字列は textContent で入れる (HTML として解釈しない)
  const MAX_LINKS = 100;
  function showLinks(items) {
    const list = $('links');
    const batch = document.createDocumentFragment();
    for (const it of items || []) {
      if (!it || typeof it.url !== 'string' || !/^https?:\/\//.test(it.url)) continue;
      for (const old of list.querySelectorAll('li')) if (old.dataset.url === it.url) old.remove();
      const a = document.createElement('a'); // URL 自体をリンクにする
      a.href = it.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = it.url;
      const li = document.createElement('li');
      li.dataset.url = it.url;
      li.append(a);
      if (it.title) li.append(` ${it.title}`);
      batch.append(li);
    }
    list.prepend(batch);
    while (list.children.length > MAX_LINKS) list.lastElementChild.remove();
    $('links_box').hidden = list.children.length === 0;
    list.scrollTop = 0;
  }

  function readUi() {
    const ui = {
      mute: $('mute').checked,
      on: $('on').checked,
      radio: $('radio').checked,
      interval_s: parseInt($('interval_s').value, 10),
      quiet_start: $('quiet_start').value,
      quiet_end: $('quiet_end').value,
      drama: drama !== null,
    };
    if ($('speaker').options.length) ui.speaker = parseInt($('speaker').value, 10);
    if ($('persona').options.length) ui.persona = $('persona').value;
    return ui;
  }
  // 声の選択肢は AivisSpeech の /speakers (配信元が起動時に取得)。取れなければ選択欄を出さない
  function fillSpeakers(speakers) {
    for (const s of speakers || []) $('speaker').add(new Option(s.name, String(s.id)));
    $('speaker_label').hidden = !$('speaker').options.length;
  }
  // ペルソナの選択肢は personas.toml (配信元が起動時に読む)。1 人だけなら選択欄を出さない
  function fillPersonas(personas) {
    for (const p of personas || []) $('persona').add(new Option(p.name, p.id));
    $('persona_label').hidden = $('persona').options.length < 2;
  }
  // WS ポートと設定欄の初期値は配信元 (idle_talk.main) が idle_talk.toml から返す。
  async function loadServerConfig() {
    const res = await fetch('config.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(`config.json: HTTP ${res.status}`);
    return res.json();
  }
  function applyUiDefaults(ui) {
    for (const [k, v] of Object.entries(ui || {})) {
      const el = $(k);
      if (!el) continue;
      if (el.type === 'checkbox') el.checked = Boolean(v); else el.value = String(v);
    }
  }
  const serverConfig = loadServerConfig().then((c) => { fillSpeakers(c.speakers); fillPersonas(c.personas); applyUiDefaults(c.ui); return c; });
  serverConfig.catch((e) => { $('error').textContent = String(e); });
  function pushUi() { if (client) client.sendUi(readUi()); }
  for (const id of ['mute', 'on', 'radio', 'interval_s', 'quiet_start', 'quiet_end', 'speaker', 'persona']) {
    $(id).addEventListener('change', pushUi);
  }

  // 押し直すとマイク取り込み・接続が二重になる (前の分を止めない) ので、押したら無効にし、失敗したときだけ戻す
  $('start').addEventListener('click', async () => {
    $('start').disabled = true;
    try {
      const actx = new AudioContext();
      const port = new URLSearchParams(location.search).get('port') || String((await serverConfig).ws_port);
      sink = IdleTalkPlayer.createWebAudioSink(actx, undefined, volume());
      const player = IdleTalkPlayer.createPlayer({
        sink,
        send: (m) => { if (client) client.sendJson(m); },
      });
      client = C.createClient({
        port, WebSocketCtor: WebSocket, player,
        onState: (m) => { $('state').textContent = C.stateLabel(m, NAMES); },
        onError: (m) => { $('error').textContent = `[${m.code}] ${m.message}`; },
        onSearch: (m) => { $('search').textContent = m.active ? `Web で「${m.query}」を調べています…` : ''; },
        onLinks: (m) => showLinks(m.items),
        onSnap: async (m) => { // 一言・感想の直前に今の画面を 1 枚返す。映像が無ければ jpeg を省く
          const jpeg = drama && drama.snapshot ? await drama.snapshot() : null;
          if (client) client.sendJson(jpeg ? { t: 'snap', id: m.id, jpeg } : { t: 'snap', id: m.id });
        },
        onOpen: () => { $('error').textContent = ''; pushUi(); }, // 画面の設定 (自発発話 ON 等) を接続時に送る。変更時だけだとサーバ既定 (オフ) のまま
        onClose: () => { $('state').textContent = '再接続中…'; $('search').textContent = ''; },
      });
      await C.startCapture({
        getUserMedia: (c) => navigator.mediaDevices.getUserMedia(c),
        AudioContextCtor: AudioContext, workletUrl: 'worklet.js', client,
      });
      $('drama').disabled = false;
    } catch (e) {
      $('error').textContent = String(e);
      if (client) client.close();
      client = null;
      $('start').disabled = false;
    }
  });

  // ドラマモード: 共有したタブの音を AI も聞き、場面の切れ目にたまに一言言う
  function showDrama() {
    $('drama').textContent = drama ? 'ドラマを見るのをやめる' : 'ドラマを一緒に見る';
    $('drama_state').textContent = drama ? 'ドラマ視聴中' : '';
  }
  $('drama').addEventListener('click', async () => {
    if (drama) { drama.stop(); return; }
    try {
      drama = await C.startDramaCapture({
        getDisplayMedia: (c) => navigator.mediaDevices.getDisplayMedia(c),
        AudioContextCtor: AudioContext, workletUrl: 'worklet.js', client,
        // LLM が画像を読めるときだけ映像を残す (LLM の起動後に決まるので、画面を開いた時ではなく共有の開始時に聞く)
        vision: loadServerConfig().then((c) => Boolean(c.vision), () => false),
        onEnded: () => { drama = null; showDrama(); pushUi(); },
      });
      $('error').textContent = '';
      showDrama();
      pushUi();
    } catch (e) {
      $('error').textContent = String(e);
    }
  });
})();
</script>
</body>
</html>
