<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>idle-talk</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #f2f7f3; --card: #ffffff; --text: #1b2620; --muted: #66786d; --line: #dfe9e2;
    --accent: #22a06b; --accent-2: #0ea5a4; --accent-soft: rgba(34, 160, 107, .12);
    --ok: #84cc16; --warn: #f59e0b; --busy: #3b82f6; --danger: #ef4444;
    --radius: 16px; --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 24px rgba(16, 24, 40, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1411; --card: #161e1a; --text: #e6efe9; --muted: #869a8e; --line: #24302a;
      --accent: #34d399; --accent-2: #2dd4bf; --accent-soft: rgba(52, 211, 153, .16); --shadow: 0 8px 24px rgba(0, 0, 0, .35);
    }
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 20px 48px; display: grid; gap: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 {
    margin: 0; font-size: 26px; letter-spacing: -.02em; font-weight: 750;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .status { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--line); font-size: 13px; font-weight: 600;
  }
  .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); }
  #state[data-state="idle"] { --c: var(--ok); }
  #state[data-state="user_speaking"], #state[data-state="eot_check"], #state[data-state="interrupt_check"] { --c: var(--warn); }
  #state[data-state="preparing"] { --c: var(--busy); }
  #state[data-state="ai_playing"] { --c: var(--accent); }
  #state[data-state="ai_playing"]::before, #state[data-state="user_speaking"]::before { animation: pulse 1.2s ease-in-out infinite; }
  #state[data-state="rest"] { --c: var(--muted); }
  #state[data-state="offline"] { --c: var(--danger); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 5px transparent; transform: scale(1.25); } 0%, 100% { box-shadow: 0 0 0 0 var(--c); } }
  .tag { padding: 5px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 600; }
  .tag:empty { display: none; }
  .notice { margin: 0; padding: 10px 14px; border-radius: 12px; font-size: 14px; }
  .notice:empty { display: none; }
  #search { background: var(--accent-soft); color: var(--text); }
  #error { background: rgba(239, 68, 68, .1); color: var(--danger); border: 1px solid rgba(239, 68, 68, .25); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; }
  .card h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
  button {
    font: inherit; cursor: pointer; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text);
    padding: 12px 16px; font-weight: 600; transition: transform .08s, background .15s, border-color .15s, box-shadow .15s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  button:active:not(:disabled) { transform: scale(.98); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .connection { color: var(--muted); font-size: 13px; }
  .switch.connection input { width: 32px; height: 18px; }
  .switch.connection input::after { width: 12px; height: 12px; }
  .switch.connection input:checked::after { transform: translateX(14px); }
  .modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .modes button { display: flex; align-items: center; gap: 10px; text-align: left; }
  .modes button::before { font-size: 20px; }
  #drama::before { content: "🎬"; }
  #screen::before { content: "🖥️"; }
  #camera::before { content: "📷"; }
  #pc::before { content: "💬"; }
  #transcribe::before { content: "📝"; }
  .modes button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px 16px; }
  .field { display: grid; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .field input, .field select {
    font: inherit; font-size: 15px; font-weight: 400; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .switches { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-bottom: 16px; }
  .switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
  .switch input {
    appearance: none; margin: 0; width: 40px; height: 22px; border-radius: 999px; background: var(--line);
    position: relative; cursor: pointer; transition: background .2s;
  }
  .switch input::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .2s;
  }
  .switch input:checked { background: var(--accent); }
  .switch input:checked::after { transform: translateX(18px); }
  .switch input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .volume { display: flex; align-items: center; gap: 12px; margin-top: 16px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .volume input { flex: 1; accent-color: var(--accent); }
  #volume_text { min-width: 3.5em; text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
  #links { list-style: none; margin: 0; padding: 0; max-height: 20em; overflow-y: auto; display: grid; gap: 6px; }
  #links li { padding: 8px 12px; border-radius: 10px; background: var(--bg); font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  #links a { display: block; color: var(--accent); text-decoration: none; font-weight: 600; }
  #links a:hover { text-decoration: underline; }
  #transcript { list-style: none; margin: 0; padding: 0; max-height: 28em; overflow-y: auto; display: grid; gap: 6px; }
  #transcript li { padding: 8px 12px; border-radius: 10px; background: var(--bg); font-size: 14px; overflow-wrap: anywhere; }
  #transcript .who { color: var(--accent); font-weight: 600; margin-right: .5em; }
  #transcript time { color: var(--muted); font-size: 12px; margin-right: .5em; font-variant-numeric: tabular-nums; }
  #transcript li.partial { color: var(--muted); background: transparent; border: 1px dashed var(--line); }
</style>
</head>
<body>
<main class="wrap">
<header>
  <h1>idle-talk</h1>
  <div class="status"><span id="state" class="pill" data-state="stopped">停止中</span><span id="drama_state" class="tag"></span><label class="switch connection" title="オフにすると音声認識・発話・共有を停止します"><input type="checkbox" id="connect" role="switch"> 接続</label></div>
</header>
<p id="search" class="notice"></p>
<p id="error" class="notice" role="alert"></p>
<section class="card">
  <div class="modes">
    <button id="drama" disabled aria-pressed="false">ドラマを一緒に見る</button>
    <button id="screen" disabled aria-pressed="false">画面を一緒に見る</button>
    <button id="camera" disabled aria-pressed="false">カメラで見てもらう</button>
    <button id="pc" disabled aria-pressed="false">ブラウザ補正なし</button>
    <button id="transcribe" disabled aria-pressed="false">文字起こし</button>
  </div>
</section>
<section class="card">
  <h2>設定</h2>
  <div class="switches">
    <label class="switch" title="AI の発話を休止します。音声認識も止めるには右上の接続をオフにしてください"><input type="checkbox" id="mute"> 休止</label>
    <label class="switch"><input type="checkbox" id="on" checked> 自発発話</label>
    <label class="switch"><input type="checkbox" id="radio"> ラジオ</label>
    <label class="switch" title="オフならドラマモード中はマイクを聞かない (拾った台詞を話しかけと取らない)"><input type="checkbox" id="drama_mic" checked> ドラマ中もマイク</label>
  </div>
  <div class="grid">
    <label class="field">沈黙秒数 <input type="number" id="interval_s" min="10" max="3600" value="1200"></label>
    <label class="field">静音開始 <input type="time" id="quiet_start" value="23:00"></label>
    <label class="field">静音終了 <input type="time" id="quiet_end" value="07:00"></label>
    <label class="field" id="persona_label" hidden>ペルソナ <select id="persona"></select></label>
    <label class="field" id="speaker_label" hidden>声 <select id="speaker"></select></label>
  </div>
  <label class="volume">音量 <input type="range" id="volume" min="0" max="200" step="5" value="100"> <span id="volume_text">100%</span></label>
</section>
<section class="card" id="links_box" hidden>
  <h2>URL</h2>
  <ul id="links"></ul>
</section>
<section class="card" id="transcript_box" hidden>
  <h2>文字起こし</h2>
  <ul id="transcript"></ul>
</section>
</main>
<script src="worklet.js"></script>
<script src="player.js"></script>
<script src="client.js"></script>
<script>
(function () {
  const C = IdleTalkClient;
  const NAMES = { idle: '待機', user_speaking: 'ユーザー発話中', eot_check: '終話確認中',
    preparing: '返答準備中', ai_playing: 'AI再生中', interrupt_check: '割り込み確認中', rest: '休止' };
  const $ = (id) => document.getElementById(id);
  let client = null;
  let drama = null; // 共有中のタブの音 (startDramaCapture の戻り値)
  let screen = null; // 共有中の画面 (startScreenCapture の戻り値)。drama とは同時に使わない
  let camera = null; // Web カメラ (startCameraCapture の戻り値)。drama・screen とは同時に使わない
  let pc = false; // ブラウザ補正なしモード (共有はしない。AI の声はサーバがスピーカーに鳴らす)
  let transcribe = false; // 文字起こしモード (AI は話さず、認識結果を話者の仮名つきで出す)
  let sink = null;
  let connection = null;
  let errorCode = null; // 表示中のサーバのエラーコード (一時的なものは再生が始まったら消す)
  function showError(text, code) { $('error').textContent = text; errorCode = code; }

  // 音量はブラウザ内だけで掛ける (サーバに送らない)。開始前でも変えられ、localStorage に残す
  const VOLUME_KEY = 'idle-talk.volume';
  function volume() { return IdleTalkPlayer.clampVolume(parseInt($('volume').value, 10) / 100); }
  function showVolume() {
    $('volume_text').textContent = `${$('volume').value}%`;
    if (sink) sink.setVolume(volume());
  }
  const savedVolume = localStorage.getItem(VOLUME_KEY);
  if (savedVolume !== null) $('volume').value = savedVolume;
  showVolume();
  $('volume').addEventListener('input', showVolume);
  $('volume').addEventListener('change', () => localStorage.setItem(VOLUME_KEY, $('volume').value));

  // 話したニュース・調べたページを URL 欄の先頭に積む (1 回分の並びは保つ)。MAX_LINKS 行を超えたら古い順 (下) から消す。
  // 同じ URL は前の行を消して先頭に付け直す。http(s) 以外は出さず、文字列は textContent で入れる (HTML として解釈しない)
  const MAX_LINKS = 100;
  function showLinks(items) {
    const list = $('links');
    const batch = document.createDocumentFragment();
    for (const it of items || []) {
      if (!it || typeof it.url !== 'string' || !/^https?:\/\//.test(it.url)) continue;
      for (const old of list.querySelectorAll('li')) if (old.dataset.url === it.url) old.remove();
      const a = document.createElement('a'); // URL 自体をリンクにする
      a.href = it.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = it.url;
      const li = document.createElement('li');
      li.dataset.url = it.url;
      li.append(a);
      if (it.title) li.append(` ${it.title}`);
      batch.append(li);
    }
    list.prepend(batch);
    while (list.children.length > MAX_LINKS) list.lastElementChild.remove();
    $('links_box').hidden = list.children.length === 0;
    list.scrollTop = 0;
  }

  // 文字起こしを下に積む (新しいものが下)。MAX_TRANSCRIPT 行を超えたら古い順 (上) から消す。文字列は textContent で入れる
  const MAX_TRANSCRIPT = 500;
  let finalUid = 0; // 確定した区間の utterance_id の最大。これ以前の区間の仮の文字は出さない
  // 仮の文字 (話している途中の認識結果) は末尾の 1 行だけ。確定が来たら消して確定の行を足す
  function showPartial(m) {
    if (!(m.seg > finalUid)) return;
    const list = $('transcript');
    const atBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 20;
    let li = list.querySelector('li.partial');
    if (!li) { li = document.createElement('li'); li.className = 'partial'; list.append(li); }
    li.dataset.seg = String(m.seg);
    li.textContent = String(m.text || '');
    $('transcript_box').hidden = false;
    if (atBottom) list.scrollTop = list.scrollHeight;
  }
  function showTranscript(m) {
    const list = $('transcript');
    const atBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 20; // 遡って読んでいる間は飛ばさない
    if (m.uid) finalUid = Math.max(finalUid, m.uid);
    const partial = list.querySelector('li.partial');
    if (partial && !(Number(partial.dataset.seg) > finalUid)) partial.remove();
    const li = document.createElement('li');
    const time = document.createElement('time');
    time.textContent = new Date(m.ts || Date.now()).toLocaleTimeString('ja-JP', { hour12: false });
    const who = document.createElement('span');
    who.className = 'who';
    who.textContent = String(m.speaker || '');
    li.append(time, who, String(m.text || ''));
    const rest = list.querySelector('li.partial'); // 次の区間の仮の文字は確定の行の下に残す
    if (rest) list.insertBefore(li, rest); else list.append(li);
    while (list.children.length > MAX_TRANSCRIPT) list.firstElementChild.remove();
    $('transcript_box').hidden = false;
    if (atBottom) list.scrollTop = list.scrollHeight;
  }

  function readUi() {
    const ui = {
      mute: $('mute').checked,
      on: $('on').checked,
      radio: $('radio').checked,
      drama_mic: $('drama_mic').checked,
      interval_s: parseInt($('interval_s').value, 10),
      quiet_start: $('quiet_start').value,
      quiet_end: $('quiet_end').value,
      drama: drama !== null,
      screen: screen !== null,
      camera: camera !== null,
      pc,
      transcribe,
    };
    if ($('speaker').options.length) ui.speaker = parseInt($('speaker').value, 10);
    if ($('persona').options.length) ui.persona = $('persona').value;
    return ui;
  }
  // 声の選択肢は AivisSpeech の /speakers (配信元が起動時に取得)。取れなければ選択欄を出さない
  function fillSpeakers(speakers) {
    for (const s of speakers || []) $('speaker').add(new Option(s.name, String(s.id)));
    $('speaker_label').hidden = !$('speaker').options.length;
  }
  // ペルソナの選択肢は personas.toml (配信元が起動時に読む)。1 人だけなら選択欄を出さない
  function fillPersonas(personas) {
    for (const p of personas || []) $('persona').add(new Option(p.name, p.id));
    $('persona_label').hidden = $('persona').options.length < 2;
  }
  // WS ポートと設定欄の初期値は配信元 (idle_talk.main) が idle_talk.toml から返す。
  async function loadServerConfig() {
    const res = await fetch('config.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(`config.json: HTTP ${res.status}`);
    return res.json();
  }
  function applyUiDefaults(ui) {
    for (const [k, v] of Object.entries(ui || {})) {
      const el = $(k);
      if (!el) continue;
      if (el.type === 'checkbox') el.checked = Boolean(v); else el.value = String(v);
    }
  }
  const serverConfig = loadServerConfig().then((c) => { fillSpeakers(c.speakers); fillPersonas(c.personas); applyUiDefaults(c.ui); return c; });
  serverConfig.catch((e) => { showError(String(e), null); });
  function pushUi() { if (client) client.sendUi(readUi()); }
  for (const id of ['mute', 'on', 'radio', 'drama_mic', 'interval_s', 'quiet_start', 'quiet_end', 'speaker', 'persona']) {
    $(id).addEventListener('change', pushUi);
  }

  function stopConnection() {
    const old = connection;
    connection = null;
    client = null;
    if (old) {
      if (old.client) old.client.close();
      if (old.player) old.player.reset();
      if (old.capture) old.capture.stop();
      if (old.actx) old.actx.close();
    }
    if (drama) drama.stop();
    if (screen) screen.stop();
    if (camera) camera.stop();
    drama = screen = camera = sink = null;
    pc = transcribe = false;
    $('connect').checked = false;
    $('state').textContent = '停止中';
    $('state').dataset.state = 'stopped';
    $('search').textContent = '';
    showDrama();
  }
  window.addEventListener('pagehide', stopConnection);
  function openMic(c, raw) {
    return C.startCapture({
      getUserMedia: (m) => navigator.mediaDevices.getUserMedia(m),
      AudioContextCtor: AudioContext, workletUrl: 'worklet.js', client: c, raw,
    });
  }
  // 文字起こしの切り替えでマイクを開き直す (エコー除去は開いた後の applyConstraints では確実に切り替わらない)
  async function reopenMic(raw) {
    const session = connection;
    if (!session || !session.capture || !session.client) return;
    try {
      const capture = await openMic(session.client, raw);
      if (connection !== session || transcribe !== raw) { capture.stop(); return; }
      session.capture.stop();
      session.capture = capture;
    } catch (e) {
      if (connection === session) showError(String(e), null);
    }
  }
  $('connect').addEventListener('change', async () => {
    if (!$('connect').checked) { stopConnection(); return; }
    const session = {};
    connection = session;
    $('state').textContent = '接続中…';
    $('state').dataset.state = 'offline';
    try {
      const actx = session.actx = new AudioContext();
      const port = new URLSearchParams(location.search).get('port') || String((await serverConfig).ws_port);
      if (connection !== session) return;
      sink = IdleTalkPlayer.createWebAudioSink(actx, undefined, volume());
      const player = session.player = IdleTalkPlayer.createPlayer({
        sink,
        send: (m) => {
          if (C.errorResolved(errorCode, m)) showError('', null); // 再生が始まった = 一時的な失敗は解消した
          if (connection === session && session.client) session.client.sendJson(m);
        },
      });
      client = session.client = C.createClient({
        port, WebSocketCtor: WebSocket, player,
        onState: (m) => { $('state').textContent = C.stateLabel(m, NAMES); $('state').dataset.state = m.state; },
        onError: (m) => showError(`[${m.code}] ${m.message}`, m.code),
        onSearch: (m) => { $('search').textContent = m.active ? `Web で「${m.query}」を調べています…` : ''; },
        onLinks: (m) => showLinks(m.items),
        onTranscript: showTranscript,
        onPartial: showPartial,
        onSnap: async (m) => { // 一言・感想の直前に今の画面を 1 枚返す。映像が無ければ jpeg を省いて理由を送る
          const src = drama || screen || camera;
          const r = src ? await src.snapshot() : { reason: 'not sharing' };
          if (connection === session) session.client.sendJson(r.jpeg ? { t: 'snap', id: m.id, jpeg: r.jpeg, thumb: r.thumb } : { t: 'snap', id: m.id, reason: r.reason });
        },
        onOpen: () => { showError('', null); pushUi(); }, // 画面の設定 (自発発話 ON 等) を接続時に送る。変更時だけだとサーバ既定 (オフ) のまま
        onClose: () => { $('state').textContent = '再接続中…'; $('state').dataset.state = 'offline'; $('search').textContent = ''; },
      });
      const capture = await openMic(client, transcribe);
      if (connection !== session) { capture.stop(); return; }
      session.capture = capture;
      showDrama();
    } catch (e) {
      if (connection !== session) return;
      stopConnection();
      showError(String(e), null);
    }
  });

  // ドラマモード: 共有したタブの音を AI も聞き、場面の切れ目にたまに一言言う
  function showDrama() {
    $('drama').textContent = drama ? 'ドラマを見るのをやめる' : 'ドラマを一緒に見る';
    $('screen').textContent = screen ? '画面を見るのをやめる' : '画面を一緒に見る';
    $('camera').textContent = camera ? 'カメラを止める' : 'カメラで見てもらう';
    $('pc').textContent = pc ? 'ブラウザ補正なしをやめる' : 'ブラウザ補正なし';
    $('pc').disabled = !client || transcribe;
    $('transcribe').textContent = transcribe ? '文字起こしをやめる' : '文字起こし';
    $('transcribe').disabled = !client || drama !== null || screen !== null || camera !== null || pc; // AI が話すモードとは同時に使わない
    $('transcribe').setAttribute('aria-pressed', String(transcribe));
    $('drama').setAttribute('aria-pressed', String(drama !== null)); // 使用中のモードのボタンを強調する (CSS)
    $('screen').setAttribute('aria-pressed', String(screen !== null));
    $('camera').setAttribute('aria-pressed', String(camera !== null));
    $('pc').setAttribute('aria-pressed', String(pc));
    $('drama_state').textContent = drama ? 'ドラマ視聴中' : screen ? (screen.stream ? '画面を見ています' : '前面のウィンドウを見ています')
      : camera ? (camera.stream ? 'カメラで見ています' : 'カメラ (サーバ) を見ています') : pc ? 'ブラウザ補正なしで会話中 (スピーカーで)'
      : transcribe ? '文字起こし中 (AI は話しません)' : '';
    $('drama').disabled = !client || screen !== null || camera !== null || transcribe; // 共有は 1 つずつ
    $('screen').disabled = !client || drama !== null || camera !== null || transcribe;
    $('camera').disabled = !client || drama !== null || screen !== null || transcribe;
  }
  $('drama').addEventListener('click', async () => {
    if (drama) { drama.stop(); return; }
    const owner = connection;
    try {
      const capture = await C.startDramaCapture({
        getDisplayMedia: (c) => navigator.mediaDevices.getDisplayMedia(c),
        AudioContextCtor: AudioContext, workletUrl: 'worklet.js', client,
        // LLM が画像を読めるときだけ映像を残す (LLM の起動後に決まるので、画面を開いた時ではなく共有の開始時に聞く)
        vision: loadServerConfig().then((c) => Boolean(c.vision), () => false),
        onEnded: () => { if (connection !== owner) return; drama = null; showDrama(); pushUi(); },
      });
      if (connection !== owner) { capture.stop(); return; }
      drama = capture;
      showError('', null);
      showDrama();
      pushUi();
    } catch (e) {
      if (connection !== owner) return;
      showError(String(e), null);
    }
  });

  // 画面モード: 共有した画面 ([screen].follow_window なら前面のウィンドウ) を AI もときどき見て、
  // 前に話したときから変わっていれば一言言う
  $('screen').addEventListener('click', async () => {
    if (screen) { screen.stop(); return; }
    const owner = connection;
    try {
      const opts = {
        getDisplayMedia: (c) => navigator.mediaDevices.getDisplayMedia(c),
        vision: loadServerConfig().then((c) => Boolean(c.vision), () => false),
        onEnded: () => { if (connection !== owner) return; screen = null; showDrama(); pushUi(); },
      };
      // follow_window は起動時に決まるので読込済みの設定で見る (共有画面を出す前に待つとクリックの扱いが切れる)
      const follow = await serverConfig.then((c) => Boolean(c.follow_window), () => false);
      if (connection !== owner) return;
      const capture = follow ? await C.startWindowWatch(opts) : await C.startScreenCapture(opts);
      if (connection !== owner) { capture.stop(); return; }
      screen = capture;
      showError('', null);
      showDrama();
      pushUi();
    } catch (e) {
      if (connection !== owner) return;
      showError(String(e), null);
    }
  });

  // カメラモード: Web カメラの映像を AI もときどき見て、前に話したときから変わっていれば一言言う
  $('camera').addEventListener('click', async () => {
    if (camera) { camera.stop(); return; }
    const owner = connection;
    try {
      const opts = {
        getUserMedia: (c) => navigator.mediaDevices.getUserMedia(c),
        vision: loadServerConfig().then((c) => Boolean(c.vision), () => false),
        onEnded: () => { if (connection !== owner) return; camera = null; showDrama(); pushUi(); },
      };
      // cameras.toml に url = "browser" が無ければ、サーバがネットワークカメラ等を撮るので Web カメラは開かない
      const browserCam = await serverConfig.then((c) => c.camera_browser !== false, () => true);
      if (connection !== owner) return;
      const capture = browserCam ? await C.startCameraCapture(opts) : await C.startWindowWatch(opts);
      if (connection !== owner) { capture.stop(); return; }
      camera = capture;
      showError('', null);
      showDrama();
      pushUi();
    } catch (e) {
      if (connection !== owner) return;
      showError(String(e), null);
    }
  });

  // ブラウザ補正なしモード: マイクと AI の声をブラウザ (Chrome) のエコー除去に通さず、サーバが直接録って鳴らす。
  // スピーカーで鳴る別の音声 AI (ブラウザの ChatGPT など) とも、マイクとスピーカーでそのまま話せる。
  // AI の声はサーバ (Chrome の外) が鳴らす。ブラウザが鳴らすと、相手のエコー除去に消されるため
  $('pc').addEventListener('click', () => {
    pc = !pc;
    showDrama();
    pushUi();
  });

  // 文字起こしモード: AI は話さず、聞こえた発話を声の特徴から付けた仮名 (「低く落ち着いた声1」等) つきで書き出す。
  // マイクはエコー除去・雑音抑制なしで開き直す (別のタブで再生した動画の声をスピーカー越しに拾えるように)
  $('transcribe').addEventListener('click', () => {
    transcribe = !transcribe;
    showDrama();
    pushUi();
    reopenMic(transcribe);
  });
})();
</script>
</body>
</html>
