# idle-talk 共通設定。起動時のカレントディレクトリから読む (--config で変更可)。
# CLI 引数 (--port / --*-url / --speaker) が指定されればそちらが優先。
[ports]
ws = 8765    # idle_talk.main の WebSocket サーバ (ブラウザへは /config.json で渡す)
asr = 8090   # idle_talk.asr_worker
llm = 8091   # llama-server
tts = 10101  # AivisSpeech
web = 8000   # web/ の配信 (main が起動。ブラウザは http://127.0.0.1:8000/ を開く)

[tts]
# speaker: AivisSpeech の話者 (スタイル) ID。一覧は AivisSpeech の GET /speakers
#   まお: ノーマル=888753760 ふつー=888753761 あまあま=888753762 おちつき=888753763 からかい=888753764 せつなめ=888753765
#   コハク: ノーマル=1878365376 あまあま=1878365377 せつなめ=1878365378 ねむたい=1878365379
#   らせつん: 標準=893625024 標準２=893625030 喜び=893625025 悲しみ=893625029 怒り=893625027 驚き=893625031 嫌悪=893625026 恐怖=893625028
speaker = 893625024  # らせつん 標準
# 声パラメータ (AivisSpeech の audio_query を上書き)。行を消すと AivisSpeech の既定値になる。
speed = 1.0           # 話速 0.5〜2.0 (既定 1.0。大きいほど速い)
intonation = 1.0      # スタイルの感情表現の強さ 0.0〜2.0 (既定 1.0。上げすぎると発声が崩れることがある)
tempo_dynamics = 1.0  # テンポの緩急 0.0〜2.0 (既定 1.0。大きいほど早口で生っぽい)
pitch = 0.0           # 音高 -0.15〜0.15 (既定 0.0。0 以外は音質が劣化する)
volume = 0.3          # 音量 0.0〜2.0 (既定 1.0)
pause = 1.0           # 句読点の無音の倍率 0 以上 (既定 1.0。小さいほど間が短い)
pre_silence = 0.1     # 音声の前の無音 (秒、既定 0.1)
post_silence = 0.1    # 音声の後の無音 (秒、既定 0.1)

[spontaneous]
# 自発発話 (AI からの話しかけ)。起動時の既定値で、画面の設定欄の初期値にもなる (画面で変えた値は保存されない)。
on = true             # 自発発話を有効にする
interval_s = 10       # 沈黙がこの秒数続いたら話しかける (10〜3600)。無反応が続くと 2 倍ずつ延びる
quiet_start = "23:00" # 休止時間帯の開始 (この間は話しかけない)
quiet_end = "07:00"   # 休止時間帯の終了

[llm]
# model を指定すると Director が llama-server を起動・監督し、異常終了時に LLM_RETRY で再起動する。
# 空なら手動起動 (監督なし)。起動時に既に [ports].llm で応答していれば二重起動せず監督もしない。
server = "D:/tools/llama.cpp/llama-server.exe"
model = "D:/models/Qwen3.5-4B-Q4_K_M.gguf"
ngl = 99
ctx = 4096
