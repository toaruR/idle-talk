# idle-talk 共通設定。起動時のカレントディレクトリから読む (--config で変更可)。
# CLI 引数 (--port / --*-url / --speaker) が指定されればそちらが優先。
[ports]
ws = 8765    # idle_talk.main の WebSocket サーバ (ブラウザへは /config.json で渡す)
asr = 8090   # idle_talk.asr_worker
llm = 8091   # llama-server
tts = 10101  # AivisSpeech
web = 8000   # web/ の配信 (main が起動。ブラウザは http://127.0.0.1:8000/ を開く)

[asr]
# 音声認識のエンジン。reazon = ReazonSpeech (CPU、日本語の精度が高い。pip install sherpa-onnx とモデルが要る)、
# whisper = faster-whisper small (GPU0)。変えたら idle-talk.cmd restart。
engine = "reazon"
model_dir = "data/models/reazonspeech"  # reazon のモデル (sherpa-onnx-zipformer-ja-reazonspeech-2024-08-01, Apache-2.0)
threads = 2           # reazon の CPU スレッド数 (1〜32)。AivisSpeech の声が遅れるなら下げる
# 食器の音・咳などを「はい」「誰」「ハハ」と聞き違える対策: short_chars 字以下の認識結果は、
# AI の声の最中か、話し終えてから short_reply_s 秒以内 (返事・相槌) のときだけ使う。0 で無効
short_chars = 2       # 0〜10
short_reply_s = 20    # 0〜3600 (秒)

[tts]
# speaker: AivisSpeech の話者 (スタイル) ID。一覧は AivisSpeech の GET /speakers
#   まお: ノーマル=888753760 ふつー=888753761 あまあま=888753762 おちつき=888753763 からかい=888753764 せつなめ=888753765
#   コハク: ノーマル=1878365376 あまあま=1878365377 せつなめ=1878365378 ねむたい=1878365379
#   らせつん: 標準=893625024 標準２=893625030 喜び=893625025 悲しみ=893625029 怒り=893625027 驚き=893625031 嫌悪=893625026 恐怖=893625028
#   morioki: ノーマル=497929760
#   れな: ノーマル=1929056672 悲しみ=1929056673 嬉しい=1929056674 普通=1929056675 驚き=1929056676
#   天深シノ: ノーマル=1063997408 じょうきげん=1063997409 ふきげん=1063997410 ささやき=1063997411
#   梅𡵅弓哥_T3モデル: ノーマル=1159744352
speaker = 497929760  
# 声パラメータ (AivisSpeech の audio_query を上書き)。行を消すと AivisSpeech の既定値になる。
speed = 1.0          # 話速 0.5〜2.0 (既定 1.0。大きいほど速い)
intonation = 1.0      # スタイルの感情表現の強さ 0.0〜2.0 (既定 1.0。上げすぎると発声が崩れることがある)
tempo_dynamics = 0.0  # テンポの緩急 0.0〜2.0 (既定 1.0。大きいほど早口で生っぽい)
pitch = 0.0           # 音高 -0.15〜0.15 (既定 0.0。0 以外は音質が劣化する)
volume = 0.5          # 音量 0.0〜2.0 (既定 1.0)
pause = 1.0           # 句読点の無音の倍率 0 以上 (既定 1.0。小さいほど間が短い)
pre_silence = 0.1     # 音声の前の無音 (秒、既定 0.1)
post_silence = 0.1    # 音声の後の無音 (秒、既定 0.1)

[vad]
# 発話検出。AI の再生中に音を拾うと音量を下げて認識を待ち、語が無い (物音) か AI 自身の声なら再生を続ける。
# 自動校正 (adaptive) では、周囲の雑音と再生中の回り込みの大きさを測り続けて閾値を決める (マイク音量の手合わせは不要)。
# 物音で発話扱いになりすぎるなら ratio か onset_ms を上げ、声を拾わないなら ratio を下げる。
adaptive = true       # 閾値を自動で決める (false なら threshold 固定)
ratio = 3.0           # 自動校正の閾値 = 雑音 (再生中は回り込み) の大きさ x ratio (1 より大、既定 3.0)
min_threshold = 100   # 自動校正の閾値の下限 (既定 100)
threshold = 500       # 発話とみなす音の大きさ (16bit PCM の RMS、既定 500)。自動校正では測り終えるまで (約 1 秒) の値
onset_ms = 100        # この長さ音が続いたら発話の開始とみなす (20〜1000、既定 100。短い物音を無視する)

[spontaneous]
# 自発発話 (AI からの話しかけ)。起動時の既定値で、画面の設定欄の初期値にもなる (画面で変えた値は保存されない)。
on = true             # 自発発話を有効にする
interval_s = 15       # 沈黙がこの秒数続いたら話しかける (10〜3600)。無反応が続くと 2 倍ずつ延びる
quiet_start = "23:59" # 休止時間帯の開始 (この間は話しかけない)
quiet_end = "07:00"   # 休止時間帯の終了
radio = false         # ラジオモード: 返事を待たず数秒おきに話し続ける (質問しない・無反応でも間隔を延ばさない・無操作休止しない)

[llm]
# model を指定すると Director が llama-server を起動・監督し、異常終了時に LLM_RETRY で再起動する。
# 空なら手動起動 (監督なし)。起動時に既に [ports].llm で応答していれば二重起動せず監督もしない。
server = "D:/tools/llama.cpp/llama-server.exe"
# model = "D:/models/Qwen3.5-4B-Q4_K_M.gguf"
model = "D:/models/gemma-4-12b-it-qat-q4_0.gguf"  # 方言に強い 12B。思考は enable_thinking=false で無効
ngl = 99
ctx = 4096
main_gpu = -1          # 載せる GPU の番号 (nvidia-smi と同じ順)。分割せずこの 1 枚に載せる。-1 で自動配置 (複数 GPU に分割)
mmproj = "D:/models/mmproj-gemma-4-12b-it-qat-q4_0.gguf"  # 画像エンコーダ。指定するとドラマモードの一言・感想で画面も見る (空なら音だけ)
# image_max_tokens = 0  # 画像 1 枚のトークン上限 (0 = llama-server の既定)。画面は 640x360 で送るので約 106 トークン

[aivis]
# engine を指定すると idle-talk.cmd start / restart が AivisSpeech Engine (声) を先に起動し、stop で止める。
# 空なら手動起動。既に [ports].tts で応答していれば (AivisSpeech アプリ起動中など) 起動せず、stop でも止めない。
engine = "C:/Program Files/AivisSpeech/AivisSpeech-Engine/run.exe"
use_gpu = false       # true で GPU 合成 (既定は CPU)。出力は data/aivisspeech.log

[topics]
# 話題カード: 自発発話の話題に RSS / Atom のニュース見出しを使う (未使用のカードを 1 回の自発発話で 1 枚使う)。
# フィードの概要が短い記事はリンク先ページの説明文 (og:description) で補う。
# ネットワークに出るのはこの取得だけ。空にすると取得せず、従来の固定の話題から選ぶ。カードは公開から 24 時間で期限切れ。
feeds = [
  "https://news.web.nhk/n-data/conf/na/rss/cat0.xml",  # NHK 主要ニュース (旧 www3.nhk.or.jp/rss は 2026-08 で更新停止)
  "https://rss.itmedia.co.jp/rss/2.0/aiplus.xml",  # ITmedia AI+ (Google ニュースはリンクが記事に直接届かず概要が取れない)
]
interval_min = 30     # 取得間隔 (分)。休止中は取得しない

[search]
# Web 検索: 「日経平均株価を教えて」「もっと詳しく」など、調べないと答えられない質問のとき、
# LLM の判断で Web を検索し (「ちょっと調べてみるね」と伝えてから)、結果を元に答える。
# 外部に送るのは LLM が作った検索語と、読むページの URL だけ。false なら検索せず、ネットワークにも出ない。
on = true
engines = ["duckduckgo", "bing"]  # 先頭から試し、失敗・0 件なら次へ (使えるのは duckduckgo / bing)
read_page = true      # 上位 1 件のページ本文を r.jina.ai 経由で読んで添える (株価などの今の値が取れる。約 1〜5 秒)

[voice_id]
# 話者識別: 声の特徴で話し相手を見分け、初めての声 (2 回続けて同じ知らない声) なら会話の中で名前を聞いて覚える。
# 以後はその名前で呼ぶ。1.5 秒未満の短い発話では判定せず、直前の相手のままにする。
# 声の特徴は data/idle_talk.db にだけ保存し、外部に送らない。確認・削除は idle-talk.cmd speakers。
# 別人を同じ人と取り違えるなら threshold を上げ、同じ人を別人扱いするなら下げる。
on = true
model = "data/models/voxceleb_resnet34_LM.onnx"  # WeSpeaker ResNet34 (CC-BY-4.0)。無ければ警告して識別なしで動く
threshold = 0.6       # 同じ人とみなす声の近さ (0〜1、既定 0.6)

[drama]
# ドラマモード: 画面の「ドラマを一緒に見る」で共有したタブの音を AI も聞き、場面の切れ目にたまに一言つぶやく。
# 利用者が話しかければ直近の台詞を踏まえて答える。台詞はメモリにだけ置き、保存も外部送信もしない。
# 共有時に「タブの音声も共有する」をオンにする。スピーカーだとドラマの音をマイクが拾うのでヘッドホン推奨。
interval_s = 15       # 前の一言から最低これだけ空ける (10〜3600 秒)。多すぎるなら上げる
gap_ms = 800         # 台詞がこれだけ途切れたら場面の切れ目とみなして一言を考える (500〜30000)
window_s = 180        # 一言・返答の材料にする台詞の範囲 (直近の秒数、30〜1800)
min_chars = 60        # 前の一言から溜まった台詞がこれ未満なら黙る (0〜2000)
ctx_chars = 1200      # LLM に渡す台詞の上限字数 (100〜4000)
max_seg_s = 15        # BGM 等で台詞の区間が終わらなくても、この秒数で切って認識する (3〜60)
finale_gap_s = 60     # 台詞がこれだけ聞こえなければ見終わった (一時停止) とみなし、それまでの感想を話す (10〜1800 秒)
finale_min_chars = 600  # 前の感想 (または開始) から聞いた台詞がこれ未満なら感想は言わない (0〜20000)
digest_chars = 800    # 台詞がこれだけ溜まったら裏であらすじメモに要約し、感想の材料にする (100〜2000)
log_prompt = true     # 一言・感想・要約で LLM に渡した台詞とメモを data/talk.log に DRAMA(...) 行で残す (false なら台詞を保存しない)
